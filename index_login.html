<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b35">
<title>제품 특성 관리</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172522;background:#f3f6f4}
*{box-sizing:border-box}body{margin:0}header{background:#183b35;color:white;padding:19px 18px;position:sticky;top:0;z-index:2}
h1{font-size:20px;margin:0}header p{margin:0;color:#d4e2dc;font-size:12px}
.brand-logo{width:136px;max-width:100%;height:auto;display:block;background:white;border-radius:5px;padding:3px}.brand-block{display:flex;align-items:center;gap:9px;min-width:0}.brand-block h1{font-size:15px;white-space:nowrap}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.header-add{background:#fff;color:#183b35;border-radius:12px;width:42px;height:42px;padding:0;font-size:30px;font-weight:400;line-height:1;flex-shrink:0}
main{max-width:760px;margin:auto;padding:18px 15px}
input,textarea,button{font:inherit}input,textarea{width:100%;border:1px solid #d4ded9;border-radius:10px;padding:12px;background:white;color:#172522}
textarea{min-height:88px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 14px;background:#183b35;color:white;font-weight:650;cursor:pointer}
button.secondary{background:#e3ebe7;color:#183b35}button.danger{background:#fff0ee;color:#a33328}button.small{padding:8px 10px;font-size:13px}
.searchbox{margin-bottom:12px}.searchbox label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
.addrow{margin-bottom:18px}.addrow button{width:100%;padding:13px}
.card{background:white;border:1px solid #e1e8e4;border-radius:14px;padding:15px;margin-bottom:9px}
.card h2{font-size:17px;margin:0 0 5px}.muted{color:#73817b;font-size:12px}
.actions{display:flex;gap:7px;margin-top:12px}.actions button{flex:1}
.product-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.product-menu-wrap{position:relative;flex:0 0 auto}
.menu-trigger{background:#e3ebe7;color:#183b35;padding:5px 12px;font-size:22px;line-height:1;border-radius:9px;min-width:42px}
.product-menu{display:none;position:absolute;right:0;top:42px;z-index:4;min-width:112px;padding:6px;background:white;border:1px solid #dce5e0;border-radius:10px;box-shadow:0 6px 20px #10282022}
.product-menu.open{display:block}
.product-menu button{display:block;width:100%;text-align:left;background:white;color:#183b35;padding:10px;font-size:14px}
.product-menu button.danger{color:#a33328;background:white}
.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px}
#editor{display:none}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.photo{position:relative}.photo img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid #e1e8e4}
.photo button{position:absolute;right:4px;top:4px;padding:4px 7px;background:#172522dd}
.empty{text-align:center;padding:35px 12px;color:#718079;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#172522;color:white;padding:10px 16px;border-radius:30px;display:none;z-index:5;font-size:13px;max-width:90%;text-align:center}
.inline{display:flex;gap:8px}.inline>*{flex:1}
.note{font-size:12px;color:#718079;line-height:1.5;margin-top:12px}
#photoInput{padding:10px;background:#f8faf9}
@media(min-width:600px){.photos{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<section id="loginScreen" style="display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;background:#f3f6f4"><div style="background:white;border-radius:18px;padding:24px;width:100%;max-width:420px"><h1 style="color:#183b35;margin-bottom:10px">아이씨케미칼 제품관리</h1><p style="color:#66756f">Firebase 등록 계정으로 로그인</p><label for="loginEmail">이메일</label><input id="loginEmail" type="email" autocomplete="username" placeholder="이메일 주소" style="margin:8px 0 14px"><label for="loginPassword">비밀번호</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="비밀번호" style="margin:8px 0 16px" onkeydown="if(event.key==='Enter')firebaseLogin()"><button style="width:100%" onclick="firebaseLogin()">로그인</button><p id="loginMessage" style="color:#a33328;font-size:13px"></p></div></section>
<section id="splash" style="display:none;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:linear-gradient(145deg,#183b35,#28594e);color:white">
 <div style="font-size:13px;letter-spacing:3px;opacity:.8;margin-bottom:22px">IC CHEMICAL</div>
 <h1 style="font-size:clamp(27px,7vw,38px);line-height:1.45;margin:0 0 12px;font-weight:800">아이씨케미칼<br>제품관리어플</h1>
 <p style="font-size:13px;color:#d4e2dc;margin:0 0 42px">제품 정보를 쉽고 빠르게 관리하세요.</p>
 <button onclick="enterApp()" style="background:white;color:#183b35;min-width:180px;padding:15px 26px;font-size:16px">시작하기</button>
</section>

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getStorage, ref, uploadString, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyBex0i-4Eao5xfFbMda45Ibavor6H2j-k0",
  authDomain: "ic-chemical-manager.firebaseapp.com",
  projectId: "ic-chemical-manager",
  storageBucket: "ic-chemical-manager.firebasestorage.app",
  messagingSenderId: "70051014344",
  appId: "1:70051014344:web:edf5c51ef51ab71e3067fd"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
let user=null;
const status=()=>document.getElementById('cloudStatus');
function state(message){if(status())status().textContent=message;}
function col(){if(!user)throw new Error('로그인이 필요합니다. Firebase Authentication 익명 로그인을 활성화하세요.');return collection(db,'products');}
function itemRef(id){return doc(col(),id);}
function photoPath(id){return `users/${user.uid}/products/${id}/${Date.now()}_${Math.random().toString(36).slice(2)}.jpg`;}
async function uploadPhotos(product){
 const result=[];
 for(const src of product.photos||[]){
  if(!src.startsWith('data:')){result.push(src);continue;}
  const path=photoPath(product.id),fileRef=ref(storage,path);
  await uploadString(fileRef,src,'data_url');result.push(await getDownloadURL(fileRef));
 }
 return result;
}
window.cloudAPI={
 ready:async()=>{if(user)return true;throw new Error('로그인이 필요합니다.');},
 load:async()=>{const snap=await getDocs(col());return snap.docs.map(x=>x.data());},
 save:async p=>{const photos=await uploadPhotos(p);const saved={...p,photos};await setDoc(itemRef(p.id),saved);return saved;},
 remove:async p=>{await deleteDoc(itemRef(p.id));for(const url of p.photos||[]){if(!url.startsWith('https://'))continue;try{await deleteObject(ref(storage,url));}catch(e){console.warn('사진 삭제 실패',e);}}}
};
window.firebaseLogin=async()=>{
 const email=document.getElementById('loginEmail').value.trim();
 const password=document.getElementById('loginPassword').value;
 const msg=document.getElementById('loginMessage');
 msg.textContent='로그인 중…';
 try {await signInWithEmailAndPassword(auth,email,password);msg.textContent='';}
 catch(e){console.error(e);msg.textContent='로그인 실패: 이메일과 비밀번호를 확인해 주세요. ('+e.code+')';}
};
window.firebaseLogout=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
 user=u;
 document.getElementById('loginScreen').style.display=u?'none':'flex';
 document.getElementById('appScreen').style.display=u?'block':'none';
 document.getElementById('splash').style.display='none';
 if(u){state('☁ Firebase 로그인됨');if(window.refreshCloud)await window.refreshCloud();}
 else state('로그인이 필요합니다.');
});
</script>
<script>
function enterApp(){if(window.firebaseLogin)document.getElementById('loginScreen').style.display='flex';}
const DB='product-characteristics-db', STORE='products';
const categories=[
 {id:'name',name:'제품명'},{id:'pack',name:'포장방법'},{id:'viscosity',name:'점성'},
 {id:'msds',name:'MSDS'},{id:'appearance',name:'색상 / 외관'},{id:'memo',name:'기타 특이사항'}
];
let products=[], editingId=null, editPhotos=[];
const $=id=>document.getElementById(id);
function dbOpen(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function all(){let db=await dbOpen();return new Promise((res,rej)=>{let r=db.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
async function put(item){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite'),r=tx.objectStore(STORE).put(item);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error||r.error);tx.onabort=()=>rej(tx.error)})}
async function del(id){let db=await dbOpen();return new Promise((res,rej)=>{let tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(id);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toggleProductMenu(id,button,event){
 event.stopPropagation();
 const menu=button.nextElementSibling;
 const wasOpen=menu.classList.contains('open');
 document.querySelectorAll('.product-menu.open').forEach(m=>m.classList.remove('open'));
 document.querySelectorAll('.menu-trigger[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
 if(!wasOpen){menu.classList.add('open');button.setAttribute('aria-expanded','true')}
}
document.addEventListener('click',()=>{
 document.querySelectorAll('.product-menu.open').forEach(m=>m.classList.remove('open'));
 document.querySelectorAll('.menu-trigger[aria-expanded="true"]').forEach(b=>b.setAttribute('aria-expanded','false'));
});
function render(){
 const q=$('search').value.trim().toLocaleLowerCase();
 const list=products.filter(p=>JSON.stringify(p.values||{}).toLocaleLowerCase().includes(q));
 $('productList').innerHTML=list.length?list.map(p=>`<div class="card">
  <div class="product-head">
   <div style="flex:1;min-width:0;cursor:pointer" onclick="viewProduct('${p.id}')">
    <h2>${safe(p.values?.name||'이름 없는 제품')}</h2>
    <div class="muted">${safe(p.values?.pack||'포장방법 미입력')} · 사진 ${p.photos?.length||0}장　›</div>
   </div>
   <div class="product-menu-wrap">
    <button class="menu-trigger" aria-label="제품 메뉴" aria-expanded="false" onclick="toggleProductMenu('${p.id}',this,event)">⋮</button>
    <div class="product-menu">
     <button onclick="editProduct('${p.id}')">수정</button>
     <button class="danger" onclick="deleteProduct('${p.id}')">삭제</button>
    </div>
   </div>
  </div>
  
 </div>`).join(''):'<div class="empty">'+(q?'검색 결과가 없습니다.':'등록된 제품이 없습니다. 오른쪽 위 + 버튼으로 추가하세요.')+'</div>';
}
function newProduct(){editingId=null;editPhotos=[];$('editorTitle').textContent='제품 등록';showEditor({});}
function editProduct(id){let p=products.find(x=>x.id===id);if(!p)return;editingId=id;editPhotos=Array.isArray(p.photos)?[...p.photos]:[];$('editorTitle').textContent='제품 수정';showEditor(p.values||{});}
function showEditor(values){
 $('fields').innerHTML=categories.map(c=>`<div class="field"><label for="f_${c.id}">${safe(c.name)}</label><textarea id="f_${c.id}" data-cat="${c.id}" placeholder="${safe(c.name)} 내용을 입력하세요">${safe(values[c.id]||'')}</textarea></div>`).join('');
 $('photoInput').value='';$('photoStatus').textContent='현재 등록된 사진: '+editPhotos.length+'장';renderPhotos();
 $('home').style.display='none';$('editor').style.display='block';window.scrollTo(0,0);
}
function closeEditor(){$('editor').style.display='none';$('home').style.display='block';$('search').focus();render()}
function renderPhotos(){$('photoPreview').innerHTML=editPhotos.map((src,i)=>`<div class="photo"><img src="${src}" alt="제품 사진 ${i+1}"><button type="button" aria-label="사진 삭제" onclick="removePhoto(${i})">×</button></div>`).join('');$('photoStatus').textContent='등록할 사진: '+editPhotos.length+'장'}
function removePhoto(i){editPhotos.splice(i,1);renderPhotos()}
function readFile(file){return new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>reject(new Error('파일을 읽지 못했습니다.'));fr.readAsDataURL(file)})}
async function compressImage(file){
 const data=await readFile(file);
 try{
  const img=new Image();img.src=data;await new Promise((res,rej)=>{img.onload=res;img.onerror=rej});
  const max=1600,scale=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));
  const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/jpeg',0.78);
 }catch(e){return data}
}
$('photoInput').addEventListener('change',async e=>{
 const files=Array.from(e.target.files||[]);if(!files.length)return;
 $('photoStatus').textContent='사진 처리 중…';
 try{
  for(const file of files){if(!file.type.startsWith('image/'))continue;const compressed=await compressImage(file);editPhotos.push(compressed);renderPhotos()}
  toast(files.length+'개 파일을 불러왔습니다.');
 }catch(err){toast('사진을 불러오지 못했습니다. 다른 사진 파일로 다시 시도해 주세요.')}
 e.target.value='';
});
async function saveProduct(){
 const values={};document.querySelectorAll('#fields textarea').forEach(el=>values[el.dataset.cat]=el.value.trim());
 if(!values.name){toast('제품명을 입력해 주세요.');$('f_name').focus();return}
 const p={id:editingId||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2)),values,photos:editPhotos,updatedAt:new Date().toISOString()};
 try{
   await put(p);products=await all();closeEditor();render();
   if(window.cloudAPI){
    try{await window.cloudAPI.ready();const saved=await window.cloudAPI.save(p);await put(saved);products=await all();render();toast('Firebase에 저장됐습니다.');}
    catch(e){console.error(e);toast('휴대폰에 저장됨 · Firebase 저장 실패');document.getElementById('cloudStatus').textContent='⚠ Firebase 저장 실패: '+(e.code||e.message);}
   }else toast('휴대폰에 저장됐습니다.');
  }
 catch(err){console.error(err);toast('저장 공간이 부족하거나 저장 오류가 발생했습니다. 사진 수를 줄여 다시 시도해 주세요.')}
}
function viewProduct(id){
 const p=products.find(x=>x.id===id);if(!p)return;
 $('fields').innerHTML=categories.map(c=>`<div class="field"><label>${safe(c.name)}</label><div style="white-space:pre-wrap;line-height:1.55">${safe(p.values?.[c.id]||'미입력')}</div></div>`).join('');
 const pics=(p.photos||[]).map((src,i)=>`<div><img src="${src}" alt="제품 사진 ${i+1} 확대" onclick="openPhoto('${p.id}',${i})" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:zoom-in" role="button" tabindex="0" onkeydown="if(event.key==='Enter')openPhoto('${p.id}',${i})"></div>`).join('');
 $('fields').innerHTML+=`<div class="field"><label>제품 사진 (${p.photos?.length||0}장)</label><div class="photos">${pics||'<span class="muted">등록된 사진이 없습니다.</span>'}</div></div>`;
 $('editorTitle').textContent=p.values?.name||'제품 상세';
 $('photoInput').parentElement.style.display='none';
 $('editor').style.display='block';$('home').style.display='none';window.scrollTo(0,0);
 let old=$('editor').querySelector('.viewActions');if(old)old.remove();
 const actions=document.createElement('div');actions.className='actions viewActions';
 actions.innerHTML=`<button onclick="closeViewThenEdit('${p.id}')">수정</button><button class="secondary" onclick="closeView()">닫기</button>`;
 $('editor').append(actions);
}
let lightboxPhotos=[],lightboxIndex=0;
function openPhoto(id,index){
 const p=products.find(x=>x.id===id);if(!p||!p.photos?.[index])return;
 lightboxPhotos=p.photos;lightboxIndex=index;showPhoto();$('photoLightbox').style.display='flex';document.body.style.overflow='hidden';
}
function showPhoto(){
 $('lightboxImage').src=lightboxPhotos[lightboxIndex];
 $('lightboxCount').textContent=(lightboxIndex+1)+' / '+lightboxPhotos.length;
 $('photoPrev').style.visibility=lightboxPhotos.length>1?'visible':'hidden';
 $('photoNext').style.visibility=lightboxPhotos.length>1?'visible':'hidden';
}
function stepPhoto(n){lightboxIndex=(lightboxIndex+n+lightboxPhotos.length)%lightboxPhotos.length;showPhoto()}
function closePhoto(){ $('photoLightbox').style.display='none';$('lightboxImage').removeAttribute('src');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if($('photoLightbox').style.display!=='flex')return;if(e.key==='Escape')closePhoto();if(e.key==='ArrowLeft')stepPhoto(-1);if(e.key==='ArrowRight')stepPhoto(1)});
function closeView(){let a=$('editor').querySelector('.viewActions');if(a)a.remove();$('photoInput').parentElement.style.display='block';closeEditor()}
function closeViewThenEdit(id){let a=$('editor').querySelector('.viewActions');if(a)a.remove();$('photoInput').parentElement.style.display='block';editProduct(id)}
async function deleteProduct(id){
 if(!confirm('이 제품을 삭제할까요?'))return;
 const p=products.find(x=>x.id===id);
 try{
  if(window.cloudAPI){try{await window.cloudAPI.remove(p);}catch(e){console.error(e);toast('Firebase 삭제 실패: '+(e.code||e.message));return;}}
  await del(id);products=await all();render();toast('삭제했습니다.');
 }catch(e){console.error(e);toast('삭제하지 못했습니다.');}
}
$('search').addEventListener('input',render);
window.refreshCloud=async()=>{
 try{
  const cloud=await window.cloudAPI.load();
  // 이전 휴대폰 데이터는 삭제하지 않고, 클라우드에 있는 항목만 병합합니다.
  for(const p of cloud)await put(p);
  products=await all();render();
  document.getElementById('cloudStatus').textContent='☁ Firebase 연결됨 · 제품 '+cloud.length+'개 동기화';
 }catch(e){console.error(e);document.getElementById('cloudStatus').textContent='⚠ Firebase 읽기 실패: '+(e.code||e.message);}
};
(async()=>{products=await all();render()})().catch(e=>{console.error(e);toast('저장소 초기화에 실패했습니다. Chrome에서 다시 열어 주세요.')});
</script>
